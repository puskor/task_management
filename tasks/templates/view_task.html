{% extends "home.html" %}
{% block content %}
<body>
    <div class="w-1/2 mx-auto">
        <ul>
            {% for task in tasks %}
                <li class="mb-4">
                    <div class="font-bold items-center">{{ task.title|upper }}</div>
                    <div class="text-gray-600">{{ task.project.name }}</div>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>

{% endblock content %}
