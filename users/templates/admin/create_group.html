{% extends "admin/dashboard.html" %}

{% block content %}
<ul>
    {% for message in messages %}
        <li class="bg-green-500 text-white px-1 py-2 text-center ">{{message|upper}}</li>
    {% endfor %}
</ul>

<div class="w-1/2 mx-auto my-8">

    <body>
        <form method="POST">
            {% csrf_token %}
            {{form}}
            <button type="submit" class="p-2 m-2 border-4 border-black rounded-lg">Create</button>
        </form>
    </body>
</div>


{% endblock content %}
