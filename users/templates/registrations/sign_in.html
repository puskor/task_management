{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "css/output.css" %}">

</head>
<body>
    <div class="w-1/2 mx-auto mt-3">
        <h1 class="text-4xl text-center"> Welcome to our website</h1>
        <div>
            {% if messages %}
                {% for message in messages %}
                    <div class="px-2 py-1 if{% if message.tags == 'success' %} bg-green-500 {% endif %}">{{message}}</div>
                {% endfor %}
            {% endif %}
        </div>
        <div>
            <form method="POST">
                {% csrf_token %}
                <div class="border-2 p-2 grid gap-3">
                    <input type="text" placeholder="Enter your username" class="border-2" name="username">
                    <input type="password" placeholder="Enter your password" class="border-2" name="password">
                    <button type="submit" class="border-2 rounded-lg p-2 m-3 hover:text-white hover:bg-black">SIGN IN</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
