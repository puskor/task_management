

{% extends "account/profile.html" %}
{% block password %}
<div class="h-screen">
<div class="w-1/2 mx-auto mt-3  bg-white p-4 border-2 ">
    <h1 class="text-3xl text-center p-2 font-bold"> WELCOME</h1>
    <div>
        {% if messages %}
            {% for message in messages %}
                <div class="px-2 py-1 if{% if message.tags == 'success' %} bg-green-500 {% endif %}">{{message}}</div>
            {% endfor %}
        {% endif %}
    </div>
    <div>
        
            <div class="border-2 p-2 grid">
                <div>
                    <h1 class="bg-black text-white text-center p-2">Change password</h1>
                </div>
                <div>
                    {% for error in errors %}
                        {{error}}
                    {% endfor %}
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="p-2 grid gap-3">
                        {{form}}
                        <button type="submit" class="border-2 rounded-lg p-2 m-3 hover:text-white hover:bg-black">Change</button>
                    </div>
                </form>

    

            </div>
    </div>
</div>
</div>
{% endblock password %}
